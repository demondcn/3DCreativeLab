<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: production-catalog-bw.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Akshar:wght@700&family=Mea+Culpa:wght@400&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#464646}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1586px">
  <div class="r-masthead region chrome" data-region="masthead"><!-- black navigation bar with brand, links and WhatsApp action --></div>
  <div class="r-brand region text" data-region="brand"><!-- 3DCreativeLab wordmark --><p style="line-height:1.05;margin:0">brand</p></div>
  <div class="r-nav-products region text" data-region="nav-products"><!-- Productos navigation link --><p style="font-size:var(--r-nav-products-font);line-height:1.05;margin:0">nav-products</p></div>
  <div class="r-nav-custom region text" data-region="nav-custom"><!-- Personalizados navigation link --><p style="font-size:var(--r-nav-custom-font);line-height:1.05;margin:0">nav-custom</p></div>
  <div class="r-nav-process region text" data-region="nav-process"><!-- Como fabricamos navigation link --><p style="font-size:var(--r-nav-process-font);line-height:1.05;margin:0">nav-process</p></div>
  <div class="r-whatsapp region control" data-region="whatsapp"><!-- red WhatsApp contact button: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop whatsapp); a control need not have button chrome --></div>
  <div class="r-hero-headline region text" data-region="hero-headline"><!-- Del archivo al objeto display headline --><p style="font-size:var(--r-hero-headline-font);font-family:var(--r-hero-headline-family),sans-serif;font-weight:var(--r-hero-headline-weight);line-height:1.05;margin:0">hero-headline</p></div>
  <div class="r-hero-support region text" data-region="hero-support"><!-- Spanish offer statement about professional printed pieces --><p style="font-size:var(--r-hero-support-font);line-height:1.05;margin:0">hero-support</p></div>
  <div class="r-hero-action region control" data-region="hero-action"><!-- red Explorar catalogo action: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop hero-action); a control need not have button chrome --></div>
  <figure class="r-inspection-line region plate" data-region="inspection-line"><img src="../../../assets/plates/inspection-line.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <div class="r-product-one-data region text" data-region="product-one-data"><!-- Maceta facetada product name, demo price, availability and fabrication time --><p style="font-size:var(--r-product-one-data-font);line-height:1.05;margin:0">product-one-data</p></div>
  <div class="r-product-two-data region text" data-region="product-two-data"><!-- Soporte para audifonos product name, demo price, availability and fabrication time --><p style="font-size:var(--r-product-two-data-font);line-height:1.05;margin:0">product-two-data</p></div>
  <div class="r-product-three-data region text" data-region="product-three-data"><!-- Dinosaurio articulado product name, demo price, under-order state and fabrication time --><p style="font-size:var(--r-product-three-data-font);font-family:var(--r-product-three-data-family),sans-serif;font-weight:var(--r-product-three-data-weight);line-height:1.05;margin:0">product-three-data</p></div>
  <div class="r-custom-band region chrome" data-region="custom-band"><!-- solid red personalized request section field --></div>
  <div class="r-custom-title region text" data-region="custom-title"><!-- Necesitas una pieza personalizada heading --><p style="font-size:var(--r-custom-title-font);line-height:1.05;margin:0">custom-title</p></div>
  <div class="r-custom-copy region text" data-region="custom-copy"><!-- paragraph reading Cuentanos tu idea, te asesoramos y la fabricamos en 3D --><p style="font-size:var(--r-custom-copy-font);line-height:1.05;margin:0">custom-copy</p></div>
  <figure class="r-printer-detail region plate" data-region="printer-detail"><img src="../../../assets/plates/printer-detail.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
</main>
</body>
</html>
